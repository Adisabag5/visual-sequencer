name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The prepare script installs git hooks, which a runner has no use for and
  # which would fail on a shallow or hook-less checkout.
  HUSKY: 0

jobs:
  # Fast feedback: lint, types and the unit suite all finish in well under a
  # minute. Kept separate from e2e so a formatting slip does not wait behind a
  # browser download.
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only chromium: playwright.config.ts defines exactly one browser, so
      # pulling firefox and webkit would be minutes spent on nothing.
      - run: pnpm exec playwright install --with-deps chromium

      # The `app` project only: the instrument on its own, no server and no
      # database, so this stays the fast signal. The API-backed specs are the
      # job below, which has a lot more to set up.
      - run: pnpm e2e:app

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-app
          path: playwright-report/
          retention-days: 7

  # The specs that need a real server and a real database behind the browser.
  # Separate because it costs a MySQL service, a second checkout and a second
  # install — none of which should stand between a typo and its lint error.
  e2e-api:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-not-a-secret
          MYSQL_DATABASE: pulse_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -pci-not-a-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      # Both repos as siblings, neither inside the other. pnpm walks up from a
      # nested directory, finds the outer project and decides there is nothing
      # to install — it reports "Already up to date", creates no node_modules
      # and even runs the OUTER project's prepare script. The server then has
      # no CLI and cannot build.
      - uses: actions/checkout@v4
        with:
          path: app

      # Public repo, so the default token is enough — no PAT needed.
      - uses: actions/checkout@v4
        with:
          repository: Adisabag5/sequencer-server
          path: server

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - run: pnpm install --frozen-lockfile
        working-directory: server
      - run: pnpm build
        working-directory: server

      # Fail here with a readable reason rather than inside Playwright's
      # "webServer was not able to start".
      - name: Check the server actually built
        run: test -f server/dist/main.js

      # validateEnv fails the boot on a missing key, so every one it wants has
      # to be here. These are throwaway values for a throwaway database in a
      # throwaway container — not secrets, and deliberately named so.
      - name: Give the server an env to boot with
        working-directory: server
        run: |
          cat > .env <<'ENV'
          NODE_ENV=test
          PORT=3000
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=ci-not-a-secret
          DB_NAME=pulse_e2e
          JWT_SECRET=ci-access-secret-at-least-32-characters-long
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=ci-refresh-secret-at-least-32-characters-long
          JWT_REFRESH_EXPIRES_IN=7d
          CORS_ORIGIN=http://localhost:4200
          TRUST_PROXY=1
          ENV

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      # Playwright starts both servers; NODE_ENV=test means the server builds
      # its own schema, so there is no migration step to keep in sync here.
      - run: pnpm e2e:api
        working-directory: app
        env:
          PULSE_API_DIR: ../server
          # the compiled output, so serving needs no CLI on PATH
          PULSE_API_CMD: node dist/main

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: app/playwright-report/
          retention-days: 7
